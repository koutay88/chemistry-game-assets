name: Validate and publish development data
on:
  push:
    branches: [development, 'dev/illustration-validation']
    paths:
      - 'manifest.json'
      - 'game-config.json'
      - 'chapter-master.json'
      - 'game-index.json'
      - 'materials/**'
      - 'mission-materials/**'
      - 'experiments/**'
      - 'elements/**'
      - 'characters/**'
      - 'facilities/**'
      - 'backgrounds/**'
      - 'scripts/validate-development.py'
      - '.github/workflows/validate-development.yml'
  pull_request:
    branches: [development]
    paths:
      - 'manifest.json'
      - 'game-config.json'
      - 'chapter-master.json'
      - 'game-index.json'
      - 'materials/**'
      - 'mission-materials/**'
      - 'experiments/**'
      - 'elements/**'
      - 'characters/**'
      - 'facilities/**'
      - 'backgrounds/**'
      - 'scripts/validate-development.py'
      - '.github/workflows/validate-development.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-assets-development-promotion
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install image decoder
        run: python3 -m pip install Pillow==12.1.1
      - name: Validate config, progression, and image references
        run: python3 scripts/validate-development.py
      - name: Promote only the validated snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin development
          if git fetch origin verified-development; then
            previous="$(git rev-parse FETCH_HEAD)"
            git checkout --detach "$CANDIDATE_SHA"
            if git cat-file -e "$previous:release.json" 2>/dev/null; then
              git show "$previous:release.json" > release.json
              git add release.json
            fi
            tree="$(git write-tree)"
            data_commit="$(printf 'Verified development data %s\n' "$CANDIDATE_SHA" | git commit-tree "$tree" -p "$previous")"
          else
            git checkout --detach "$CANDIDATE_SHA"
            tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
            data_commit="$(printf 'Verified development data %s\n' "$CANDIDATE_SHA" | git commit-tree "$tree" -p "$CANDIDATE_SHA")"
          fi
          git push origin "$data_commit:refs/heads/verified-development"
          git checkout --detach "$data_commit"
          printf '{"schemaVersion":1,"gameId":"world-chem-collection","ref":"%s","candidate":"%s"}\n' "$data_commit" "$CANDIDATE_SHA" > release.json
          git add release.json
          git commit -m "Point verified development to $CANDIDATE_SHA"
          git push origin HEAD:refs/heads/verified-development
